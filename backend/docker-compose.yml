services:
  backend:
    build: ./
    # Bluelink Canada identifies the client by a device ID derived from the
    # MAC address and hostname. Docker assigns new ones whenever the container
    # is recreated, which makes every rebuild a "new device" that needs an
    # emailed OTP. Pinning both keeps the device ID stable across rebuilds.
    hostname: hyundai-backend
    mac_address: "02:42:ac:11:00:42"
    env_file:
      - .env
    ports:
      # Loopback only by default: Cloudflare Tunnel reaches the API over the
      # Compose network, so the host port is just for local curl checks. Set
      # BACKEND_BIND_ADDRESS (e.g. the VM's Tailscale IP or 0.0.0.0) in .env
      # only while migrating from direct access.
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    volumes:
      - snapshot-data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      - backend

volumes:
  snapshot-data:
